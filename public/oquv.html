<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matematik analiz kursi</title>
<meta name="description" content="Limitdan hosilagacha: o‘zbek tilidagi darslar va darhol tekshiriladigan mashqlar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#0a0f3c;--muted:#474c70;--line:#dcdae8;--blue:#2230f0;--blue2:#1620c0;--sun:#ffc61a;--ok:#0b7f5c;--bad:#b3261e;--head:"Bricolage Grotesque",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.03em;line-height:1.05}
button,input{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.top{background:var(--blue);color:#fff;padding:18px 0 54px}
.wrap{max-width:1040px;margin:0 auto;padding:0 28px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:54px}
.bar a{color:#fff;font-weight:700;text-decoration:none}
.top h1{font-size:clamp(46px,9vw,112px);font-weight:800;letter-spacing:-.045em;line-height:.95}
.top p{max-width:34em;margin:16px 0 22px;color:#e2e5ff}
.meter{height:12px;background:var(--blue2);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--sun);transition:width .5s}
.small{font:500 13px var(--mono);margin-top:8px}
main{padding:34px 0 80px}
.topic{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:0;border-radius:18px;padding:18px 20px;margin-bottom:10px;transition:box-shadow .2s}
.topic:hover{box-shadow:0 0 0 2px var(--blue)}
.topic b{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:800 18px var(--head)}
.topic h2{font-size:22px}
.topic small{color:var(--muted)}
.lvl{font:500 12px var(--mono);padding:4px 10px;border-radius:999px;background:var(--line);white-space:nowrap}
.lvl.l3{background:var(--sun)}
.lvl.l2{background:var(--blue);color:#fff}
.back{background:none;border:0;padding:6px 0;color:var(--blue);font-weight:700;margin-bottom:12px}
.lesson{background:var(--card);border-radius:20px;padding:28px;margin-bottom:16px}
.lesson h2{font-size:clamp(30px,5vw,48px);margin-bottom:14px}
.lesson h3{font-size:21px;margin:22px 0 6px}
.lesson p{margin:0 0 10px}
.ex{border-left:4px solid var(--sun);padding-left:16px}
.task{background:var(--blue);color:#fff;border-radius:20px;padding:28px}
.task h3{font-size:24px;margin-bottom:8px}
.q{font-size:20px;margin:0 0 16px;overflow-x:auto}
.ans{display:flex;gap:10px;flex-wrap:wrap}
.ans input{flex:1 1 160px;min-width:0;border:0;border-radius:12px;padding:12px 16px;color:var(--ink);font-size:18px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--sun);color:var(--ink)}
.btn.alt{background:none;color:#fff;box-shadow:inset 0 0 0 2px #fff}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.note{margin-top:14px;background:#fff;color:var(--ink);border-radius:12px;padding:12px 16px;overflow-x:auto}
.note.ok{box-shadow:inset 5px 0 0 var(--ok)}
.note.bad{box-shadow:inset 5px 0 0 var(--bad)}
.streak{font:500 13px var(--mono);margin-top:14px}
@media(max-width:700px){
 .wrap{padding:0 16px}
 .bar{margin-bottom:34px}
 .topic{grid-template-columns:36px 1fr;padding:14px}
 .topic b{width:36px;height:36px;font-size:15px}
 .topic .lvl{grid-column:2;justify-self:start}
 .lesson,.task{padding:20px}
 .ans input{font-size:16px;flex-basis:100%}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <div class="bar"><a href="/">← Bosh sahifa</a><span class="small">Natija shu qurilmada saqlanadi</span></div>
 <h1>Limitdan hosilagacha</h1>
 <p>Matematik analiz kursi: qisqa dars, ishlangan misol va darhol tekshiriladigan mashqlar. Oxirida hosilani iqtisodiy masalalarda qo‘llaysiz.</p>
 <div class="meter"><i id="meter"></i></div>
 <div class="small" id="total"></div>
</div></header>
<main class="wrap" id="app"></main>

<script src="vendor/katex/katex.min.js"></script>
<script>
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const nz = (a, b) => { let n = 0; while (!n) n = R(a, b); return n; };
const sign = n => (n < 0 ? '-' : '+') + ' ' + Math.abs(n);

const TOPICS = [
  {
    title: 'Limit tushunchasi', sub: 'Funksiya nuqtaga yaqinlashganda',
    text: ['Limit $x$ biror $a$ soniga yaqinlashganda $f(x)$ qanday qiymatga intilishini bildiradi. Muhimi $f(a)$ ning o‘zi emas, $a$ atrofidagi xatti-harakat.', 'Uzluksiz funksiyalarda limit oddiy qo‘yish bilan topiladi: $\\lim_{x\\to a} f(x)=f(a)$.'],
    example: ['$\\lim_{x\\to 2}(3x+1)$ ni toping.', 'Ko‘phad uzluksiz, shuning uchun $x=2$ ni qo‘yamiz: $3\\cdot 2+1=7$.'],
    make() {
      const a = nz(-5, 6), b = nz(2, 7), c = nz(-9, 9);
      return { q: `$\\lim_{x\\to ${a}}(${b}x ${sign(c)})$ ni toping.`, a: a * b + c, hint: 'Ko‘phad uzluksiz: $x$ o‘rniga limit nuqtasini qo‘ying.', sol: `$${b}\\cdot(${a}) ${sign(c)} = ${a * b + c}$` };
    },
  },
  {
    title: 'Limitni hisoblash', sub: 'Noaniqlik va ko‘paytuvchilarga ajratish',
    text: ['Qo‘yganda $\\frac{0}{0}$ chiqsa, bu javob emas, noaniqlik. Kasrni soddalashtirish kerak.', 'Ko‘pincha surat ko‘paytuvchilarga ajratiladi va $x-a$ qisqaradi, chunki limitda $x\\ne a$.'],
    example: ['$\\lim_{x\\to 3}\\frac{x^2-9}{x-3}$ ni toping.', '$\\frac{(x-3)(x+3)}{x-3}=x+3$, demak limit $3+3=6$.'],
    make() {
      const a = nz(-6, 7); let b = nz(-6, 7); if (a + b === 0) b += 1; if (!b) b = 2; const s = a + b, p = a * b;
      return { q: `$\\lim_{x\\to ${a}}\\dfrac{x^2 ${sign(-s)}x ${sign(p)}}{x ${sign(-a)}}$ ni toping.`, a: a - b, hint: `Suratni $(x ${sign(-a)})(x-m)$ ko‘rinishiga keltiring.`, sol: `Surat $(x ${sign(-a)})(x ${sign(-b)})$ ga teng. Qisqartirgach: $${a} ${sign(-b)} = ${a - b}$` };
    },
  },
  {
    title: 'Hosila ta’rifi', sub: 'O‘zgarish tezligi va urinma',
    text: ['Hosila funksiyaning nuqtadagi o‘zgarish tezligi, geometrik ma’nosi esa urinma qiyaligi:', '$f\'(a)=\\lim_{h\\to 0}\\frac{f(a+h)-f(a)}{h}$'],
    example: ['$f(x)=x^2$ uchun $f\'(3)$ ni ta’rifdan toping.', '$\\frac{(3+h)^2-9}{h}=6+h$. $h\\to0$ da natija $6$.'],
    make() {
      const a = nz(-6, 7), k = R(2, 5);
      return { q: `$f(x)=${k}x^2$ uchun ta’rifdan foydalanib $f'(${a})$ ni toping.`, a: 2 * k * a, hint: `Ifoda $${k}(2a+h)$ ga soddalashadi.`, sol: `$\\frac{${k}(${a}+h)^2-${k}(${a})^2}{h}=${k}(2\\cdot(${a})+h)\\to ${2 * k * a}$` };
    },
  },
  {
    title: 'Hosila qoidalari', sub: 'Darajali funksiya va yig‘indi',
    text: ['Asosiy qoida: $(x^n)\'=nx^{n-1}$.', 'Yig‘indi hadma-had, o‘zgarmas ko‘paytuvchi tashqariga chiqadi, o‘zgarmas sonning hosilasi $0$.'],
    example: ['$f(x)=2x^3-5x+4$ uchun $f\'(1)$ ni toping.', '$f\'(x)=6x^2-5$, demak $f\'(1)=1$.'],
    make() {
      const a = nz(-3, 4), b = nz(-6, 6), c = nz(-9, 9), p = nz(-3, 3);
      const v = 3 * a * p * p + b;
      return { q: `$f(x)=${a}x^3 ${sign(b)}x ${sign(c)}$ uchun $f'(${p})$ ni toping.`, a: v, hint: 'Avval $f\'(x)$ ni yozing, keyin nuqtani qo‘ying.', sol: `$f'(x)=${3 * a}x^2 ${sign(b)}$, demak $f'(${p})=${v}$` };
    },
  },
  {
    title: 'Eng katta va eng kichik qiymat', sub: 'Hosila nolga teng nuqtalar',
    text: ['Ekstremum nuqtalar $f\'(x)=0$ tenglamadan topiladi.', 'Hosila ishorasi manfiydan musbatga o‘tsa minimum, musbatdan manfiyga o‘tsa maksimum bo‘ladi.'],
    example: ['$f(x)=x^2-6x+2$ ning minimum nuqtasini toping.', '$f\'(x)=2x-6=0$, demak $x=3$. Hosila manfiydan musbatga o‘tadi.'],
    make() {
      const a = nz(-7, 7), c = nz(-9, 9);
      return { q: `$f(x)=x^2 ${sign(-2 * a)}x ${sign(c)}$ funksiyaning eng kichik qiymatini toping.`, a: c - a * a, hint: '$f\'(x)=0$ dan $x$ ni toping, keyin uni $f(x)$ ga qo‘ying.', sol: `$x=${a}$, $f(${a})=${c - a * a}$` };
    },
  },
  {
    title: 'Hosila iqtisodda', sub: 'Limit xarajat va foyda',
    text: ['$C(Q)$ xarajat funksiyasi bo‘lsa, $C\'(Q)$ limit xarajat: yana bir birlik mahsulotning taxminiy narxi.', 'Bir birlik narxi $P$ bo‘lganda foyda $\\Pi(Q)=PQ-C(Q)$. Eng katta foyda odatda $\\Pi\'(Q)=0$, ya’ni $P=C\'(Q)$ da erishiladi.'],
    example: ['$C(Q)=50+Q^2$, $P=40$. Foyda eng katta bo‘ladigan $Q$ ni toping.', '$C\'(Q)=2Q=40$, demak $Q=20$.'],
    make() {
      const w = R(1, 4), k = R(5, 30), F = R(2, 9) * 10;
      return { q: `$C(Q)=${F}+${w}Q^2$, narx $P=${2 * w * k}$. Foyda eng katta bo‘ladigan $Q$ ni toping.`, a: k, hint: '$P=C\'(Q)$ tenglamasini yeching.', sol: `$${2 * w}Q=${2 * w * k}$, demak $Q=${k}$` };
    },
  },
];

const LEVELS = ['Boshlanmagan', 'Tanish', 'Malakali', 'O‘zlashtirilgan'];
const NEED = 5;
let saved = {};
try { saved = JSON.parse(localStorage.progress || '{}'); } catch {}
const store = () => { try { localStorage.progress = JSON.stringify(saved); } catch {} };
const done = i => Math.min(NEED, saved[i] || 0);
const level = i => { const n = done(i); return n >= NEED ? 3 : n >= 3 ? 2 : n >= 1 ? 1 : 0; };

const app = document.getElementById('app');
const tex = s => s.replace(/\$(.+?)\$/g, (m, t) => window.katex ? katex.renderToString(t, { throwOnError: false }) : t);

function home() {
  const sum = TOPICS.reduce((n, _, i) => n + done(i), 0), all = TOPICS.length * NEED;
  document.getElementById('meter').style.width = sum / all * 100 + '%';
  document.getElementById('total').textContent = `${TOPICS.filter((_, i) => level(i) === 3).length} / ${TOPICS.length} mavzu o‘zlashtirilgan`;
  app.innerHTML = TOPICS.map((t, i) => `<button class="topic" type="button" data-i="${i}"><b>${i + 1}</b><span><h2>${t.title}</h2><small>${t.sub}</small></span><span class="lvl l${level(i)}">${LEVELS[level(i)]}</span></button>`).join('');
  scrollTo(0, 0);
}
app.onclick = e => { const b = e.target.closest('.topic'); if (b) open(Number(b.dataset.i)); };

function open(i) {
  const t = TOPICS[i];
  app.innerHTML = `<button class="back" id="back" type="button">← Mavzular</button>
  <article class="lesson"><h2>${t.title}</h2>${t.text.map(p => `<p>${tex(p)}</p>`).join('')}
  <h3>Ishlangan misol</h3><div class="ex"><p>${tex(t.example[0])}</p><p>${tex(t.example[1])}</p></div></article>
  <section class="task" aria-live="polite"><h3>Mashq</h3><p class="q" id="q"></p>
  <form class="ans" id="form"><input id="in" inputmode="text" autocomplete="off" aria-label="Javob" placeholder="Javob" required><button class="btn">Tekshirish</button></form>
  <div class="tools"><button class="btn alt" id="hint" type="button">Yordam</button><button class="btn alt" id="sol" type="button">Yechim</button><button class="btn alt" id="next" type="button">Keyingi masala</button></div>
  <div id="note"></div><div class="streak" id="st"></div></section>`;
  const $ = id => document.getElementById(id);
  let cur, shown;
  const stat = () => { $('st').textContent = `${done(i)} / ${NEED} to‘g‘ri · ${LEVELS[level(i)]}`; };
  const note = (cls, html) => { $('note').innerHTML = `<div class="note ${cls}">${tex(html)}</div>`; };
  const fresh = () => {
    cur = t.make(); shown = false;
    $('q').innerHTML = tex(cur.q);
    $('in').value = ''; $('note').innerHTML = '';
    stat();
  };
  $('back').onclick = home;
  $('next').onclick = fresh;
  $('hint').onclick = () => note('', cur.hint);
  $('sol').onclick = () => { shown = true; note('', cur.sol); };
  $('form').onsubmit = e => {
    e.preventDefault();
    const v = Number($('in').value.trim().replace(',', '.').replace('−', '-'));
    if (Number.isNaN(v)) return note('bad', 'Javobni son bilan yozing.');
    if (v !== cur.a) return note('bad', 'Noto‘g‘ri. Yana urinib ko‘ring yoki yordamni oching.');
    if (!shown) { saved[i] = (saved[i] || 0) + 1; store(); shown = true; }
    stat();
    note('ok', 'To‘g‘ri! ' + cur.sol);
  };
  fresh();
  scrollTo(0, 0);
}
home();
</script>
</body>
</html>
