<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O‘quv platformasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#0a0f3c;--muted:#474c70;--line:#dcdae8;--blue:#2230f0;--blue2:#1620c0;--sun:#ffc61a;--bad:#b3261e;--ok:#0b7f5c;--head:"Bricolage Grotesque",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.03em;line-height:1.05}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.auth{min-height:100vh;background:var(--blue);color:#fff;display:grid;place-items:center;padding:16px}
.authBox{width:100%;max-width:460px;display:grid;gap:14px}
.authBox h1{font-size:clamp(44px,9vw,72px);font-weight:800}
.authBox a{color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2px solid currentColor;background:none;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700}
.tabs button.on{background:var(--sun);border-color:var(--sun);color:var(--ink)}
label{display:grid;gap:4px;font-size:13px;font-weight:600}
input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.btn{border:0;border-radius:999px;padding:11px 20px;background:var(--sun);color:var(--ink);font-weight:700;cursor:pointer}
.btn.ghost{background:none;box-shadow:inset 0 0 0 2px var(--ink)}
.btn.red{background:none;color:var(--bad);padding:6px 0}
.msg{font-weight:600;min-height:1.4em}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
aside{grid-row:1/3;background:var(--blue);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
aside b{font:800 19px var(--head);padding:0 10px}
aside small{display:block;font:500 11px var(--mono);padding:0 10px}
.menu{display:grid;gap:4px;align-content:start;flex:1}
.menu button{background:none;border:0;color:#fff;text-align:left;padding:11px 14px;border-radius:999px;font-weight:600;cursor:pointer;white-space:nowrap}
.menu button.on{background:var(--sun);color:var(--ink)}
.out{background:none;border:0;color:#fff;text-align:left;padding:10px 14px;font-weight:600;cursor:pointer}
main{grid-column:2;grid-row:1/3;padding:30px 36px 60px;min-width:0}
main h1{font-size:clamp(36px,6vw,68px);font-weight:800;margin-bottom:20px}
.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:12px;overflow-wrap:anywhere}
.card h3{font-size:21px;margin-bottom:6px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--ink);color:#fff;border-radius:18px;padding:18px}
.kpi:nth-child(2){background:var(--blue)}
.kpi:nth-child(3){background:var(--sun);color:var(--ink)}
.kpi b{display:block;font:800 44px/1 var(--head)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--blue)}
.lock{opacity:.55}
.tag{font:500 12px var(--mono);background:var(--line);padding:3px 9px;border-radius:999px}
.tag.ok{background:var(--sun)}
.form{display:grid;gap:10px}
pre{background:var(--ink);color:#fff;padding:12px;border-radius:10px;overflow:auto;margin:8px 0 0;max-height:220px}
textarea.code{font:500 14px var(--mono);min-height:180px}
.opt{display:flex;gap:8px;align-items:center;font-weight:400;font-size:15px;padding:4px 0}
.opt input{width:auto}
#chatBtn{position:fixed;right:16px;bottom:16px;z-index:9}
#chat{position:fixed;right:16px;bottom:70px;width:min(340px,calc(100vw - 32px));z-index:9;box-shadow:0 8px 30px rgba(10,15,60,.3)}
#chatLog{max-height:260px;overflow:auto;font-size:14px;white-space:pre-wrap}
@media(max-width:820px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
 aside{grid-row:auto;position:static;height:auto;padding:12px;gap:8px}
 .menu{display:flex;overflow-x:auto;scrollbar-width:none;flex:none}
 main{grid-column:1;grid-row:auto;padding:20px 16px 80px}
 .kpis{grid-template-columns:1fr 1fr}
 input,textarea,select{font-size:16px}
}

.auth{position:relative;overflow:hidden;grid-template-columns:minmax(0,1fr);background:linear-gradient(135deg,var(--blue) 55%,var(--blue2))}
.auth::before{content:"∫";position:absolute;right:-2vw;bottom:-14vw;font:400 62vw/1 Georgia,serif;color:var(--sun);opacity:.16;pointer-events:none}
.authBox{position:relative;max-width:500px;background:rgba(10,15,60,.32);backdrop-filter:blur(10px);padding:30px;border-radius:26px;border:1px solid rgba(255,255,255,.2)}
.authBox label{color:#fff}
#demo{align-items:center;padding-top:12px;border-top:1px solid rgba(255,255,255,.25)}
#demo span{font:500 12px var(--mono);width:100%}
aside{background:linear-gradient(180deg,var(--blue),var(--blue2))}
aside>div:first-child::before{content:"∑";display:grid;place-items:center;width:44px;height:44px;margin:0 10px 10px;border-radius:14px;background:var(--sun);color:var(--ink);font:800 24px var(--head)}
.menu button{transition:background .2s,transform .2s}
.menu button:hover:not(.on){background:rgba(255,255,255,.14);transform:translateX(3px)}
main{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
main h1{padding-bottom:14px;border-bottom:3px solid var(--ink)}
.card{border:1px solid var(--line);box-shadow:0 2px 0 var(--line);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(10,15,60,.1)}
.card h3{letter-spacing:-.02em}
.kpi{min-height:128px;display:flex;flex-direction:column;justify-content:space-between;font-weight:600;transition:transform .2s}
.kpi:hover{transform:translateY(-3px) rotate(-.6deg)}
.btn{transition:transform .15s,box-shadow .15s}
.btn:hover{transform:scale(1.04);box-shadow:0 5px 14px rgba(10,15,60,.18)}
.btn.red:hover,.btn.ghost:hover{box-shadow:none}
input,textarea,select{transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(34,48,240,.15);outline:0}
th{font:500 12px var(--mono);color:var(--muted);border-bottom:2px solid var(--ink)}
tr:hover td{background:#f4f3fb}
.card>.row{padding:10px 12px;margin-top:8px;border-radius:12px;background:var(--bg)}
.card>.row.lock{background:none;border:1px dashed var(--line)}
.bar i{background:linear-gradient(90deg,var(--blue),var(--sun))}
.tag{background:#e5e7ff;color:var(--blue2)}
.tag.ok{color:var(--ink)}
pre{font:500 13px var(--mono)}
fieldset{padding:12px!important;background:var(--bg);border-radius:12px!important}
.opt{cursor:pointer;border-radius:8px;padding:6px 8px}
.opt:hover{background:#e5e7ff}
#chatBtn{box-shadow:0 8px 22px rgba(10,15,60,.3)}
@media(max-width:820px){aside>div:first-child::before{display:none}.authBox{padding:20px}}
@media(prefers-reduced-motion:reduce){main{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<button class="btn" id="chatBtn" type="button" hidden>AI yordamchi</button>
<div class="card" id="chat" hidden><h3>AI yordamchi</h3><div id="chatLog"></div><form id="chatForm" class="row"><input id="chatIn" aria-label="Savol" placeholder="Savolingiz" required><button class="btn">Yuborish</button></form></div>
<script>
const root = document.getElementById('root');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safe = u => /^https:\/\//.test(u || '') ? esc(u) : '#';
const api = async (action, body = {}) => {
  const r = await fetch('/lms-api/' + action, { method: 'POST', body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'Server javob bermadi' }));
  if (!r.ok) throw new Error(j.error);
  return j;
};
const KINDS = ['Ma’ruza', 'Amaliyot', 'Laboratoriya', 'Mustaqil ta’lim'];
let me = null, page = '', data = {}, py = null;

function formData(f) { return Object.fromEntries(new FormData(f).entries()); }
function act(form, fn) {
  form.onsubmit = async e => {
    e.preventDefault();
    const m = form.querySelector('.msg');
    try { await fn(formData(form)); } catch (x) { if (m) m.textContent = x.message; else alert(x.message); }
  };
}

function auth(mode = 'login') {
  const reg = { student: `<label>Ism-familiya<input name="name" required></label><label>Guruh<input name="group" required></label><label>Telefon<input name="phone" required></label><label>HEMIS ID<input name="hemis" inputmode="numeric" required></label>`, teacher: `<label>Ism-familiya<input name="name" required></label><label>Telefon<input name="phone" required></label><label>Login<input name="login" required></label>` };
  root.innerHTML = `<div class="auth"><form class="authBox" id="f"><a href="/">← Bosh sahifa</a><h1>O‘quv platformasi</h1>
  <div class="tabs"><button type="button" data-m="login">Kirish</button><button type="button" data-m="student">Talaba bo‘lish</button><button type="button" data-m="teacher">O‘qituvchi bo‘lish</button></div>
  ${mode === 'login' ? '<label>HEMIS ID yoki login<input name="login" required autocomplete="username"></label>' : reg[mode]}
  <label>Parol${mode === 'login' ? '' : ' (kamida 8 belgi)'}<input name="password" type="password" required></label>
  <button class="btn">${mode === 'login' ? 'Kirish' : 'Ro‘yxatdan o‘tish'}</button>
  ${mode === 'login' ? '<div class="tabs" id="demo"><span>Parolsiz demo:</span><button type="button" data-r="student">Talaba</button><button type="button" data-r="teacher">O‘qituvchi</button><button type="button" data-r="admin">Admin</button></div>' : ''}<div class="msg" role="alert"></div></form></div>`;
  const f = document.getElementById('f');
  f.querySelectorAll('[data-m]').forEach(b => { b.classList.toggle('on', b.dataset.m === mode); b.onclick = () => auth(b.dataset.m); });
  f.querySelectorAll('[data-r]').forEach(b => { b.onclick = async () => { try { await api('demo', { role: b.dataset.r }); start(); } catch (x) { f.querySelector('.msg').textContent = x.message; } }; });
  act(f, async v => {
    if (mode === 'login') { await api('login', v); return start(); }
    const r = await api('register', { ...v, role: mode });
    if (r.pending) { auth('login'); document.querySelector('.msg').textContent = 'Ariza yuborildi. Administrator tasdiqlagach kira olasiz.'; return; }
    await api('login', { login: v.hemis, password: v.password });
    start();
  });
}

const MENUS = {
  student: [['courses', 'Mening kurslarim'], ['other', 'Boshqa kurslar'], ['library', 'Kutubxona'], ['settings', 'Sozlamalar']],
  teacher: [['overview', 'Umumiy tahlil'], ['rating', 'Reyting'], ['courses', 'Kurslarim'], ['lessons', 'Dars mashg‘ulotlari'], ['review', 'Topshiriqlar'], ['library', 'Kutubxona'], ['news', 'Yangiliklar'], ['settings', 'Sozlamalar']],
  admin: [['requests', 'Arizalar'], ['users', 'Foydalanuvchilar'], ['courses', 'Kurslar'], ['messages', 'Xabarlar'], ['files', 'Tozalash']],
};

function shell(title, html) {
  root.innerHTML = `<div class="app"><aside><div><b>${esc(me.name)}</b><small>${{ student: 'Talaba', teacher: 'O‘qituvchi', admin: 'Administrator' }[me.role]}</small></div><nav class="menu" aria-label="Bo‘limlar">${MENUS[me.role].map(([k, n]) => `<button type="button" data-p="${k}" class="${k === page ? 'on' : ''}">${n}</button>`).join('')}</nav><button class="out" id="out" type="button">Chiqish</button></aside><main><h1>${esc(title)}</h1>${me.mustChange ? '<div class="card">Vaqtinchalik parol bilan kirdingiz. Sozlamalarda yangi parol o‘rnating.</div>' : ''}<div id="v">${html}</div></main></div>`;
  root.querySelectorAll('[data-p]').forEach(b => { b.onclick = () => go(b.dataset.p); });
  document.getElementById('out').onclick = async () => { await api('logout'); me = null; toggleChat(); auth(); };
  return document.getElementById('v');
}

async function go(p) {
  page = p;
  try {
    if (p === 'settings') return settings();
    if (p === 'library') { if (me.role === 'student') return library(await api('public')); }
    if (me.role === 'student') return student(await api('studentData'));
    if (me.role === 'teacher') return teacher(await api('teacherData'));
    return admin(await api('adminData'));
  } catch (x) { root.innerHTML = `<div class="auth"><p>${esc(x.message)}</p></div>`; }
}

function settings() {
  const v = shell('Sozlamalar', `<form class="card form" id="p" style="max-width:440px"><label>Amaldagi parol<input type="password" name="current" required></label><label>Yangi parol<input type="password" name="next" required></label><button class="btn">O‘zgartirish</button><div class="msg" role="status"></div></form>`);
  act(v.querySelector('#p'), async x => { await api('password', x); me.mustChange = false; v.querySelector('.msg').textContent = 'Parol o‘zgartirildi'; v.querySelector('#p').reset(); });
}
function library(d) {
  shell('Kutubxona', d.library.map(x => `<div class="card"><h3>${esc(x.title)}</h3><span class="tag">${esc(x.type)}</span><div class="row"><a href="${safe(x.url)}" target="_blank" rel="noopener">Ochish</a></div></div>`).join('') || '<div class="card">Hozircha material yo‘q.</div>');
}

/* Talaba */
function student(d) {
  data = d;
  if (page === 'other') {
    const v = shell('Boshqa kurslar', d.others.map(c => `<div class="card"><h3>${esc(c.title)}</h3><p class="muted">${esc(c.desc)}</p><button class="btn" data-e="${c.id}" type="button">Yozilish</button></div>`).join('') || '<div class="card">Yangi kurs yo‘q.</div>');
    v.querySelectorAll('[data-e]').forEach(b => { b.onclick = async () => { await api('enroll', { courseId: b.dataset.e }); page = 'courses'; go('courses'); }; });
    return;
  }
  const v = shell('Mening kurslarim', d.mine.map(c => `<div class="card"><h3>${esc(c.title)}</h3><p class="muted">${esc(c.desc)}</p>${c.lessons.map(l => `<div class="row ${l.open ? '' : 'lock'}"><span class="tag">${esc(l.kind)}</span><strong>${esc(l.title)}</strong>${l.best >= 0 ? `<span class="tag ${l.best >= 60 ? 'ok' : ''}">${l.best}%</span>` : ''}${l.open ? `<button class="btn ghost" data-l="${c.id}|${l.id}" type="button">Ochish</button>` : '<span class="muted">Qulflangan</span>'}</div>`).join('') || '<p class="muted">Dars yo‘q.</p>'}</div>`).join('') || '<div class="card">Hali kursga yozilmagansiz.</div>');
  v.querySelectorAll('[data-l]').forEach(b => { b.onclick = () => { const [c, l] = b.dataset.l.split('|'); lesson(d.mine.find(x => x.id === c).lessons.find(x => x.id === l)); }; });
}
function lesson(l) {
  const yt = /(?:v=|youtu\.be\/)([\w-]{11})/.exec(l.video || '');
  const last = l.subs.at(-1);
  const v = shell(l.title, `<button class="btn ghost" id="b" type="button">← Orqaga</button>
  <div class="card" style="margin-top:12px"><span class="tag">${esc(l.kind)}</span><p>${esc(l.desc)}</p>${yt ? `<iframe title="Video dars" style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px" src="https://www.youtube-nocookie.com/embed/${yt[1]}" allowfullscreen></iframe>` : ''}<div class="row">${l.pdf ? `<a href="${safe(l.pdf)}" target="_blank" rel="noopener">PDF</a>` : ''}${l.slides ? `<a href="${safe(l.slides)}" target="_blank" rel="noopener">Taqdimot</a>` : ''}</div></div>
  ${last ? `<div class="card"><h3>Oxirgi natija</h3><p>${last.percent === null ? 'O‘qituvchi tekshiruvida' : last.percent + '%'}${last.ai ? ' · AI tavsiyasi' : ''}</p><p class="muted">${esc(last.comment)}</p></div>` : ''}
  <div class="card" id="t"></div>`);
  v.querySelector('#b').onclick = () => go('courses');
  const t = v.querySelector('#t');
  if (l.check === 'test') {
    t.innerHTML = `<h3>Test</h3><p class="muted">${l.count} savoldan 10 tasi tasodifiy beriladi. O‘tish uchun 60%.</p><button class="btn" id="s" type="button">Testni boshlash</button>`;
    t.querySelector('#s').onclick = async () => {
      const { questions } = await api('startTest', { lessonId: l.id });
      t.innerHTML = `<form id="q" class="form">${questions.map((q, i) => `<fieldset style="border:0;padding:0"><legend><b>${i + 1}. ${esc(q.q)}</b></legend>${q.options.map((o, j) => `<label class="opt"><input type="radio" name="a${i}" value="${j}" required>${esc(o)}</label>`).join('')}</fieldset>`).join('')}<button class="btn">Yakunlash</button><div class="msg" role="alert"></div></form>`;
      act(t.querySelector('#q'), async x => {
        const r = await api('submitTest', { lessonId: l.id, answers: questions.map((_, i) => Number(x['a' + i])) });
        t.innerHTML = `<h3>${r.percent}%</h3><p>${r.total} savoldan ${r.right} tasi to‘g‘ri. ${r.passed ? 'Keyingi dars ochildi.' : 'Qayta urinib ko‘ring.'}</p><button class="btn" id="n" type="button">Davom etish</button>`;
        t.querySelector('#n').onclick = () => go('courses');
      });
    };
    return;
  }
  const code = l.check === 'code';
  t.innerHTML = `<h3>Topshiriq</h3><p>${esc(l.prompt)}</p><form id="a" class="form">${code ? '<textarea class="code" name="answer" aria-label="Python kodi" required spellcheck="false"></textarea><button class="btn ghost" id="run" type="button">Ishga tushirish</button><pre id="o" hidden></pre>' : '<label>Fayl havolasi (Google Drive, https)<input name="answer" required></label>'}<button class="btn">Topshirish</button><div class="msg" role="status"></div></form>`;
  let out = '';
  if (code) t.querySelector('#run').onclick = async () => {
    const o = t.querySelector('#o');
    o.hidden = false; o.textContent = 'Python yuklanmoqda…';
    try {
      if (!py) {
        await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js'; s.onload = ok; s.onerror = no; document.head.append(s); });
        py = await loadPyodide();
      }
      let buf = '';
      py.setStdout({ batched: x => { buf += x + '\n'; } });
      py.setStderr({ batched: x => { buf += x + '\n'; } });
      await py.runPythonAsync(t.querySelector('textarea').value);
      out = buf || '(chiqish yo‘q)';
    } catch (x) { out = String(x.message || x); }
    o.textContent = out;
  };
  act(t.querySelector('#a'), async x => {
    const r = await api('submit', { lessonId: l.id, answer: x.answer, output: out });
    t.querySelector('.msg').textContent = r.ai ? `AI tavsiyasi: ${r.percent}%. ${r.comment}` : 'Topshirildi. O‘qituvchi tekshiradi.';
  });
}

/* O‘qituvchi */
function teacher(d) {
  data = d;
  const rating = () => `<div class="card tw"><table><tr><th>Talaba</th><th>Guruh</th><th>Ishlar</th><th>O‘rtacha</th><th></th><th>Holat</th></tr>${d.students.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.group)}</td><td>${s.done}</td><td>${s.avg}%</td><td><div class="bar"><i style="width:${s.avg}%"></i></div></td><td>${s.avg >= 75 ? 'Faol' : s.avg >= 60 ? 'O‘rtacha' : 'Past'}</td></tr>`).join('')}</table></div>`;
  if (page === 'overview' || !page) {
    const avg = d.students.length ? Math.round(d.students.reduce((n, s) => n + s.avg, 0) / d.students.length) : 0;
    shell('Umumiy tahlil', `<div class="kpis">${[[d.students.length, 'Talabalar'], [d.students.filter(s => s.done).length, 'Faol talabalar'], [d.courses.length, 'Kurslar'], [avg + '%', 'O‘rtacha o‘zlashtirish']].map(([n, t]) => `<div class="kpi" style="${t.startsWith('O‘rtacha') ? 'background:#fff;color:var(--ink)' : ''}"><b>${n}</b>${t}</div>`).join('')}</div>${rating()}`);
  } else if (page === 'rating') shell('Reyting', rating());
  else if (page === 'courses') courses(d);
  else if (page === 'lessons') lessons(d);
  else if (page === 'review') review(d);
  else if (page === 'library') tLibrary(d);
  else if (page === 'news') tNews(d);
}
function courses(d) {
  const v = shell('Kurslarim', `<form class="card form" id="c"><h3>Yangi kurs</h3><label>Nomi<input name="title" required></label><label>Tavsif<textarea name="desc" rows="2" required></textarea></label><button class="btn">Qo‘shish</button><div class="msg" role="alert"></div></form>${d.courses.map(c => `<div class="card"><h3>${esc(c.title)}</h3><p class="muted">${esc(c.desc)}</p><p class="muted">${c.students.length} talaba · ${d.lessons.filter(l => l.courseId === c.id).length} dars</p><div class="row"><button class="btn ghost" data-ed="${c.id}" type="button">Tahrirlash</button><button class="btn red" data-d="${c.id}" type="button">O‘chirish</button></div></div>`).join('')}`);
  const f = v.querySelector('#c');
  act(f, async x => { await api('saveCourse', x); go('courses'); });
  v.querySelectorAll('[data-ed]').forEach(b => { b.onclick = () => { const c = d.courses.find(x => x.id === b.dataset.ed); f.title.value = c.title; f.desc.value = c.desc; f.onsubmit = async e => { e.preventDefault(); await api('saveCourse', { id: c.id, title: f.title.value, desc: f.desc.value }); go('courses'); }; f.scrollIntoView(); }; });
  v.querySelectorAll('[data-d]').forEach(b => { b.onclick = async () => { if (confirm('Kurs va uning darslari o‘chirilsinmi?')) { await api('delCourse', { id: b.dataset.d }); go('courses'); } }; });
}
function lessons(d) {
  const v = shell('Dars mashg‘ulotlari', `<form class="card form" id="l"><h3>Yangi dars</h3>
  <label>Kurs<select name="courseId" required>${d.courses.map(c => `<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select></label>
  <label>Turi<select name="kind">${KINDS.map(k => `<option>${k}</option>`).join('')}</select></label>
  <label>Mavzu<input name="title" required></label><label>Tavsif<textarea name="desc" rows="2"></textarea></label>
  <label>YouTube havola<input name="video"></label><label>PDF havola<input name="pdf"></label><label>Taqdimot havola<input name="slides"></label>
  <label>Tekshirish<select name="check" id="ck"><option value="test">Test</option><option value="file">Fayl</option><option value="code">Python kod</option></select></label>
  <label id="qs">Savollar, har qatorda: Savol | A | B | C | D | to‘g‘ri variant raqami (1–4). Kamida 10 ta.<textarea name="raw" rows="6"></textarea></label>
  <label id="pr" hidden>Topshiriq matni<textarea name="prompt" rows="3"></textarea></label>
  <button class="btn">Saqlash</button><div class="msg" role="alert"></div></form>
  ${d.lessons.map(l => `<div class="card"><span class="tag">${esc(l.kind)}</span><h3 style="margin-top:6px">${esc(l.title)}</h3><p class="muted">${esc(d.courses.find(c => c.id === l.courseId)?.title)}</p><button class="btn red" data-d="${l.id}" type="button">O‘chirish</button></div>`).join('')}`);
  const ck = v.querySelector('#ck');
  ck.onchange = () => { v.querySelector('#qs').hidden = ck.value !== 'test'; v.querySelector('#pr').hidden = ck.value === 'test'; };
  act(v.querySelector('#l'), async x => {
    const questions = x.check !== 'test' ? [] : x.raw.split('\n').map(s => s.trim()).filter(Boolean).map(s => { const p = s.split('|').map(c => c.trim()); return { q: p[0], options: p.slice(1, -1), correct: Number(p.at(-1)) - 1 }; });
    await api('saveLesson', { ...x, questions });
    go('lessons');
  });
  v.querySelectorAll('[data-d]').forEach(b => { b.onclick = async () => { if (confirm('Dars o‘chirilsinmi?')) { await api('delLesson', { id: b.dataset.d }); go('lessons'); } }; });
}
function review(d) {
  const list = d.subs.filter(s => s.kind !== 'test').reverse();
  const v = shell('Topshiriqlar', list.map(s => `<form class="card form" data-s="${s.id}"><h3>${esc(s.student)}</h3><p class="muted">${esc(s.lesson)} · ${s.status === 'graded' ? 'Tasdiqlangan' : 'Tekshiruvda'}${s.ai ? ' · AI tavsiyasi' : ''}</p>${s.kind === 'file' ? `<a href="${safe(s.answer)}" target="_blank" rel="noopener">Faylni ochish</a>` : `<pre>${esc(s.answer)}</pre>`}${s.output ? `<pre>${esc(s.output)}</pre>` : ''}<label>Baho (%)<input name="percent" type="number" min="0" max="100" value="${s.percent ?? ''}" required></label><label>Izoh<textarea name="comment" rows="2">${esc(s.comment)}</textarea></label><button class="btn">Tasdiqlash</button><div class="msg" role="alert"></div></form>`).join('') || '<div class="card">Topshiriq yo‘q.</div>');
  v.querySelectorAll('[data-s]').forEach(f => act(f, async x => { await api('grade', { id: f.dataset.s, ...x }); go('review'); }));
}
function tNews(d) {
  const v = shell('Yangiliklar', `<form class="card form" id="n"><label>Rasm havolasi (https, ixtiyoriy)<input name="image"></label><label>Sarlavha<input name="title" required></label><label>Matn<textarea name="text" rows="4" required></textarea></label><label>Manba havolasi (https)<input name="link"></label><button class="btn">Saqlash</button><div class="msg" role="alert"></div></form>${d.news.map(x => `<div class="card"><h3>${esc(x.title)}</h3><p class="muted">${esc(x.date)}</p><button class="btn ghost" data-e="${x.id}" type="button">Tahrirlash</button> <button class="btn red" data-d="${x.id}" type="button">O‘chirish</button></div>`).join('')}`);
  const f = v.querySelector('#n');
  let edit = '';
  act(f, async x => { await api('saveNews', { ...x, id: edit }); go('news'); });
  v.querySelectorAll('[data-e]').forEach(b => { b.onclick = () => { const n = d.news.find(x => x.id === b.dataset.e); edit = n.id; for (const k of ['image', 'title', 'text', 'link']) f.elements[k].value = n[k]; f.scrollIntoView(); }; });
  v.querySelectorAll('[data-d]').forEach(b => { b.onclick = async () => { if (confirm('O‘chirilsinmi?')) { await api('delNews', { id: b.dataset.d }); go('news'); } }; });
}
function tLibrary(d) {
  const v = shell('Kutubxona', `<form class="card form" id="b"><label>Nomi<input name="title" required></label><label>Turi<select name="type"><option>Maqola</option><option>Tezis</option><option>O‘quv qo‘llanma</option><option>Darslik</option></select></label><label>Havola (https)<input name="url" required></label><button class="btn">Qo‘shish</button><div class="msg" role="alert"></div></form>${d.library.map(x => `<div class="card"><h3>${esc(x.title)}</h3><a href="${safe(x.url)}" target="_blank" rel="noopener">Ochish</a> <button class="btn red" data-d="${x.id}" type="button">O‘chirish</button></div>`).join('')}`);
  act(v.querySelector('#b'), async x => { await api('saveLib', x); go('library'); });
  v.querySelectorAll('[data-d]').forEach(b => { b.onclick = async () => { await api('delLib', { id: b.dataset.d }); go('library'); }; });
}

/* Admin */
function admin(d) {
  page ||= 'requests';
  const rows = list => `<div class="card tw"><table><tr><th>Ism</th><th>Rol</th><th>Login</th><th>Telefon</th><th>Holat</th><th></th></tr>${list.map(u => `<tr><td>${esc(u.name)}</td><td>${u.role === 'teacher' ? 'O‘qituvchi' : 'Talaba'}</td><td>${esc(u.login)}</td><td>${esc(u.phone)}</td><td>${esc(u.status)}</td><td>${u.status === 'pending' ? `<button class="btn" data-st="${u.id}|active" type="button">Tasdiqlash</button> <button class="btn red" data-st="${u.id}|rejected" type="button">Rad etish</button>` : `<button class="btn ghost" data-r="${u.id}" type="button">Vaqtinchalik parol</button> <button class="btn red" data-del="${u.id}" type="button">O‘chirish</button>`}</td></tr>`).join('')}</table></div>`;
  let v;
  if (page === 'requests') v = shell('Arizalar', `<div class="kpis">${[[d.stats.students, 'Talabalar'], [d.stats.teachers, 'O‘qituvchilar'], [d.stats.courses, 'Kurslar'], [d.subs, 'Topshirilgan ishlar']].map(([n, t]) => `<div class="kpi" style="${t.startsWith('Topshir') ? 'background:#fff;color:var(--ink)' : ''}"><b>${n}</b>${t}</div>`).join('')}</div>` + rows(d.users.filter(u => u.status === 'pending')));
  else if (page === 'users') v = shell('Foydalanuvchilar', rows(d.users));
  else if (page === 'courses') v = shell('Kurslar', d.courses.map(c => `<div class="card"><h3>${esc(c.title)}</h3><p class="muted">${c.students.length} talaba</p></div>`).join(''));
  else if (page === 'messages') v = shell('Xabarlar', d.messages.map(m => `<div class="card"><h3>${esc(m.name)}</h3><p class="muted">${esc(m.contact)}</p><p>${esc(m.text)}</p><button class="btn red" data-m="${m.id}" type="button">O‘chirish</button></div>`).join('') || '<div class="card">Xabar yo‘q.</div>');
  else {
    v = shell('Tozalash', `<form class="card form" id="pg" style="max-width:420px"><label>Necha kundan eski ishlar o‘chirilsin?<input name="days" type="number" min="0" required></label><button class="btn">O‘chirish</button><div class="msg" role="status"></div></form>`);
    act(v.querySelector('#pg'), async x => { if (!confirm('Talabalar ishlari butunlay o‘chiriladi. Davom etilsinmi?')) return; const r = await api('purgeSubs', { days: Number(x.days) }); v.querySelector('.msg').textContent = `${r.removed} ta ish o‘chirildi`; });
  }
  v.querySelectorAll('[data-st]').forEach(b => { b.onclick = async () => { const [id, status] = b.dataset.st.split('|'); await api('setStatus', { id, status }); go(page); }; });
  v.querySelectorAll('[data-r]').forEach(b => { b.onclick = async () => { const r = await api('resetPassword', { id: b.dataset.r }); prompt('Vaqtinchalik parol. Foydalanuvchiga bering:', r.temp); }; });
  v.querySelectorAll('[data-del]').forEach(b => { b.onclick = async () => { if (confirm('Foydalanuvchi o‘chirilsinmi?')) { await api('delUser', { id: b.dataset.del }); go(page); } }; });
  v.querySelectorAll('[data-m]').forEach(b => { b.onclick = async () => { await api('delMessage', { id: b.dataset.m }); go(page); }; });
}

function toggleChat() { document.getElementById('chatBtn').hidden = !me; document.getElementById('chat').hidden = true; }
document.getElementById('chatBtn').onclick = () => { const c = document.getElementById('chat'); c.hidden = !c.hidden; };
document.getElementById('chatForm').onsubmit = async e => {
  e.preventDefault();
  const i = document.getElementById('chatIn'), log = document.getElementById('chatLog'), q = i.value;
  i.value = ''; log.textContent += `Siz: ${q}\n`;
  try { log.textContent += `AI: ${(await api('chat', { text: q })).text}\n\n`; } catch (x) { log.textContent += x.message + '\n'; }
  log.scrollTop = log.scrollHeight;
};

async function start() {
  me = (await api('me')).user;
  toggleChat();
  if (!me) return auth();
  page = MENUS[me.role][0][0];
  go(page);
}
start();
</script>
